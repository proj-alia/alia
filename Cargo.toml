[workspace]
members = ["."]
resolver = "3"

[package]
name = "alia"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
local-embeddings = ["dep:fastembed", "dep:ort"]

[dependencies]
libc = "0.2"
ort = { version = "=2.0.0-rc.15", default-features = false, optional = true }
fastembed = { version = "=7.7.0", default-features = false, features = ["onnx", "ort-download-binaries-rustls-tls"], optional = true }
axum = "0.8.9"
futures-util = "0.3.34"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
jsonschema = { version = "0.61.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
subtle = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rcgen = "0.14.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
flate2 = "1"

[lints.rust]
unsafe_code = "forbid"
